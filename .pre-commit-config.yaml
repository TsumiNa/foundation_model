minimum_pre_commit_version: "4.0.0"

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]
      - id: mypy
        name: Mypy (src/)
        entry: uv run mypy src/
        language: system
        # mypy is not a per-file linter: inference crosses module boundaries, so checking only the
        # staged files gives different answers than checking the package. Run it once over src/ and
        # ignore the filenames pre-commit would pass.
        pass_filenames: false
        types_or: [python, pyi]
        require_serial: true
