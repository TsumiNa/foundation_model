[project]
name = "pfn-csp-pilot"
version = "0.1.0"
description = "PFN x CSP pilot: is there family-level rule variation in composition -> structure type?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tabpfn>=9.0",
    "tabicl>=2.0",
    "catboost>=1.2",
    "matminer>=0.10",
    "mp-api>=0.45",
    "pymatgen>=2025.1",
    "spglib>=2.5",
    "networkx>=3.3",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ""
