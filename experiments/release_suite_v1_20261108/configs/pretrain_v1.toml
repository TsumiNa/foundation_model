[model]
latent_dim = 384
encoder_hidden_dims = [256]
head_hidden_dims = [64]
kr_x_hidden_dims = [128, 64]
kr_t_hidden_dims = [16, 8]
n_kernel = 15

[training]
max_epochs = 150
encoder_lr = 0.002
head_lr = 0.005
kr_lr = 0.0005
kr_weight_decay = 5e-5
ae_lr = 0.005
learnable_loss_balancer = false
accelerator = "gpu"
devices = 1
seed = 2025

[training.scheduler]
min_lr = 1e-05
patience = 5
factor = 0.5

[training.early_stopping]
enabled = true
monitor = "val_final_loss"
mode = "min"
patience = 24
min_delta = 1e-4

[training.logging]
csv = true

