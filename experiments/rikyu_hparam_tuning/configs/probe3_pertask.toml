# stage A encoder + stage B raw per-task head winners (B-mt control arm)
#
# fm pretrain — 3-TASK encoder probe for the RIKYU hyper-parameter grid search.
#
# One task drawn from each size group of REPORT_20260809 (that report splits deficit by group
# because replay/capacity requirements differ with task size):
#
#   big    >=20k    formation_energy  N=23180  single-task ceiling R2 0.995  [qc]
#   mid    3k-8.1k  tc                N= 7207  single-task ceiling R2 0.799  [superconductor]
#   small  <=1.2k   magnetization     N= 1160  single-task ceiling R2 0.746  [magnetic]
#
# Why a 3-task SEQUENCE rather than three separate single-task runs: the encoder is shared, so
# the thing being tuned only exists under multi-task pressure. This probe is a miniature of the
# stage-C run — same replay recipe (resample "epoch", amount = max(1500, 0.3*N), patience 24,
# max_epochs 150), tasks introduced in descending size — so an encoder that wins here wins in
# the regime it is going to be deployed in.
#
# Three plain regression tasks by design: the kernel-regression and classification heads are
# stage B's subject, and putting them here would confound head capacity with encoder capacity.
# All three source datasets are represented (qc / superconductor / magnetic).
#
# [model] / [training] below are the UNTUNED baseline; grid points override them via --set.
#
[data]
composition_column = "composition"
val_split = 0.1
test_split = 0.1
split_random_seed = 42
batch_size = 256
num_workers = 0

[descriptor]
kind = "kmd"
n_grids = 8

[datasets.qc]
path = "data/qc_ac_te_mp_dos_reformat_20260515.pd.parquet"

[datasets.magnetic]
path = "data/NEMAD_magnetic_20260419_norm.parquet"

[datasets.superconductor]
path = "data/NEMAD_superconductor_20260425_norm.parquet"

[datasets.phonix]
path = "data/phonix-db-filtered_20260425_norm.parquet"

# ---- qc regression (9) ----
[[tasks]]
name = "density"
kind = "regression"
dataset = "qc"
column = "Density (normalized)"
hidden_dims = [256, 128]
lr = 0.001

[[tasks]]
name = "efermi"
kind = "regression"
dataset = "qc"
column = "Efermi (normalized)"
hidden_dims = [256, 128]
lr = 0.001

[[tasks]]
name = "final_energy"
kind = "regression"
dataset = "qc"
column = "Final energy per atom (normalized)"
hidden_dims = [256, 128]
lr = 0.002

[[tasks]]
name = "total_magnetization"
kind = "regression"
dataset = "qc"
column = "Total magnetization (normalized)"
hidden_dims = [256, 128]
lr = 0.01

[[tasks]]
name = "volume"
kind = "regression"
dataset = "qc"
column = "Volume (normalized)"
hidden_dims = [256, 128, 64]
lr = 0.001

[[tasks]]
name = "dielectric_total"
kind = "regression"
dataset = "qc"
column = "Dielectric total (normalized)"
hidden_dims = [256, 128, 64]
lr = 0.01

[[tasks]]
name = "dielectric_ionic"
kind = "regression"
dataset = "qc"
column = "Dielectric ionic (normalized)"
hidden_dims = [256, 128]
lr = 0.001

[[tasks]]
name = "dielectric_electronic"
kind = "regression"
dataset = "qc"
column = "Dielectric electronic (normalized)"
hidden_dims = [256, 128, 64]
lr = 0.001

[[tasks]]
name = "formation_energy"
kind = "regression"
dataset = "qc"
column = "Formation energy per atom (normalized)"

# ---- NEMAD magnetic regression (4) ----
hidden_dims = [256, 128]
lr = 0.01

[[tasks]]
name = "magnetization"
kind = "regression"
dataset = "magnetic"
column = "Magnetization (normalized)"
lr = 0.01

[[tasks]]
name = "curie"
kind = "regression"
dataset = "magnetic"
column = "Curie temperature (normalized)"
lr = 0.01

[[tasks]]
name = "neel"
kind = "regression"
dataset = "magnetic"
column = "Neel temperature (normalized)"
hidden_dims = [128, 64]

[[tasks]]
name = "magnetic_moment"
kind = "regression"
dataset = "magnetic"
column = "Magnetic moment (normalized)"

# ---- NEMAD superconductor regression (1) ----
hidden_dims = [256, 128]
lr = 0.01

[[tasks]]
name = "tc"
kind = "regression"
dataset = "superconductor"
column = "Transition temperature (normalized)"

# ---- phonix regression (2) ----
hidden_dims = [256, 128]
lr = 0.01

[[tasks]]
name = "kp"
kind = "regression"
dataset = "phonix"
column = "kp (normalized)"
lr = 0.001

[[tasks]]
name = "klat"
kind = "regression"
dataset = "phonix"
column = "klat (normalized)"

# ---- qc kernel regression (7) ----
hidden_dims = [128, 64]
lr = 0.002

[[tasks]]
name = "magnetic_susceptibility"
kind = "kernel_regression"
dataset = "qc"
column = "Magnetic susceptibility (normalized)"
t_column = "Magnetic susceptibility (T/K)"
lr = 0.002
x_hidden_dims = [256, 128, 64]

[[tasks]]
name = "zt"
kind = "kernel_regression"
dataset = "qc"
column = "ZT (normalized)"
t_column = "ZT (T/K)"
lr = 0.002
x_hidden_dims = [256, 128, 64]

[[tasks]]
name = "power_factor"
kind = "kernel_regression"
dataset = "qc"
column = "Power factor (normalized)"
t_column = "Power factor (T/K)"
lr = 0.002
n_kernel = 32

[[tasks]]
name = "thermal_conductivity"
kind = "kernel_regression"
dataset = "qc"
column = "Thermal conductivity (normalized)"
t_column = "Thermal conductivity (T/K)"
n_kernel = 32
x_hidden_dims = [256, 128, 64]

[[tasks]]
name = "electrical_resistivity"
kind = "kernel_regression"
dataset = "qc"
column = "Electrical resistivity (normalized)"
t_column = "Electrical resistivity (T/K)"
lr = 0.002

[[tasks]]
name = "dos_density"
kind = "kernel_regression"
dataset = "qc"
column = "DOS density (normalized)"
t_column = "DOS energy"
n_kernel = 64
x_hidden_dims = [256, 128, 64]

[[tasks]]
name = "seebeck"
kind = "kernel_regression"
dataset = "qc"
column = "Seebeck coefficient (normalized)"
t_column = "Seebeck coefficient (T/K)"

# ---- qc classification (1) ----
[[tasks]]
name = "material_type"
kind = "classification"
dataset = "qc"
column = "Material type (label)"
num_classes = 5
hidden_dims = [256, 128, 64]
lr = 0.001

[model]
latent_dim = 384
encoder_hidden_dims = [256]
head_hidden_dims = [64]
kr_x_hidden_dims = [128, 64]
kr_t_hidden_dims = [16, 8]
n_kernel = 15

[training]
max_epochs = 150
encoder_lr = 0.001
head_lr = 5e-3
kr_lr = 5e-4
kr_weight_decay = 5e-5
ae_lr = 5e-3
accelerator = "gpu"
devices = 1
seed = 2025

[training.early_stopping]
enabled = true
monitor = "val_final_loss"
mode = "min"
patience = 24
min_delta = 1e-4

[training.logging]
csv = true

[pretrain]
task_sequence = ["formation_energy", "tc", "magnetization"]
n_runs = 1
task_order = "fixed"

[pretrain.replay]
interval = 1
amount = 0.30
resample = "epoch"
# floor rule amount_t = max(1500, 0.3*N_t): only magnetization has N < 5000 (the engine clamps
# 1500 down to its 1160 labels, i.e. full coverage).
per_task = { magnetization = 1500 }

[output]
dir = "artifacts/rikyu_hparam_tuning/probe3"
