# stage A encoder + stage B raw per-task head winners (B-mt control arm)
#
# fm pretrain — 3-TASK KERNEL-REGRESSION probe (stage B-mt, the joint-tuning control arm).
#
# Every kernel-regression task in the catalog sits in the mid size band (3.4k-8.1k labels), so
# there is no big/small axis to span here as there is for the plain regression probe. The
# informative axis is instead the MEANING of the t coordinate, which is what the kernel is fitted
# over — so the three tasks span both the available size range and both t semantics:
#
#   seebeck        N=8072  t = temperature (T/K)   ceiling R2 0.603
#   dos_density    N=7009  t = DOS energy          ceiling R2 0.600
#   zt             N=3445  t = temperature (T/K)   ceiling R2 0.653
#
# Same replay recipe and epoch budget as configs/probe3.toml, so every stage reads on one axis.
# Used ONLY by the stage-B-mt control: stage B proper tunes each task's head on its own
# single-task probe; this config is where a single SHARED kernel head is tuned jointly, so the
# two strategies can be compared on identical ground.
#
[data]
composition_column = "composition"
val_split = 0.1
test_split = 0.1
split_random_seed = 42
batch_size = 256
num_workers = 0

[descriptor]
kind = "kmd"
n_grids = 8

[datasets.qc]
path = "data/qc_ac_te_mp_dos_reformat_20260515.pd.parquet"

[datasets.magnetic]
path = "data/NEMAD_magnetic_20260419_norm.parquet"

[datasets.superconductor]
path = "data/NEMAD_superconductor_20260425_norm.parquet"

[datasets.phonix]
path = "data/phonix-db-filtered_20260425_norm.parquet"

# ---- qc regression (9) ----
