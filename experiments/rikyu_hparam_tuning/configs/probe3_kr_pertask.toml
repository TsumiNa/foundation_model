column = "ZT (normalized)"
t_column = "ZT (T/K)"
lr = 0.002
x_hidden_dims = [256, 128, 64]

[[tasks]]
name = "power_factor"
kind = "kernel_regression"
dataset = "qc"
column = "Power factor (normalized)"
t_column = "Power factor (T/K)"
lr = 0.002
n_kernel = 32

[[tasks]]
name = "thermal_conductivity"
kind = "kernel_regression"
dataset = "qc"
column = "Thermal conductivity (normalized)"
t_column = "Thermal conductivity (T/K)"
n_kernel = 32
x_hidden_dims = [256, 128, 64]

[[tasks]]
name = "electrical_resistivity"
kind = "kernel_regression"
dataset = "qc"
column = "Electrical resistivity (normalized)"
t_column = "Electrical resistivity (T/K)"
lr = 0.002

[[tasks]]
name = "dos_density"
kind = "kernel_regression"
dataset = "qc"
column = "DOS density (normalized)"
t_column = "DOS energy"
n_kernel = 64
x_hidden_dims = [256, 128, 64]

[[tasks]]
name = "seebeck"
kind = "kernel_regression"
dataset = "qc"
column = "Seebeck coefficient (normalized)"
t_column = "Seebeck coefficient (T/K)"

# ---- qc classification (1) ----
[[tasks]]
name = "material_type"
kind = "classification"
dataset = "qc"
column = "Material type (label)"
num_classes = 5
hidden_dims = [256, 128, 64]
lr = 0.001

[model]
latent_dim = 384
encoder_hidden_dims = [256]
head_hidden_dims = [64]
kr_x_hidden_dims = [128, 64]
kr_t_hidden_dims = [16, 8]
n_kernel = 15

[training]
max_epochs = 150
encoder_lr = 0.001
head_lr = 5e-3
kr_lr = 5e-4
kr_weight_decay = 5e-5
ae_lr = 5e-3
accelerator = "gpu"
devices = 1
seed = 2025

[training.early_stopping]
enabled = true
monitor = "val_final_loss"
mode = "min"
patience = 24
min_delta = 1e-4

[training.logging]
csv = true

[pretrain]
task_sequence = ["seebeck", "dos_density", "zt"]
n_runs = 1
task_order = "fixed"

[pretrain.replay]
interval = 1
amount = 0.30
resample = "epoch"
# floor rule amount_t = max(1500, 0.3*N_t): only zt has N < 5000.
per_task = { zt = 1500 }

[output]
dir = "artifacts/rikyu_hparam_tuning/probe3_kr"
