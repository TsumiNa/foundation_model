# GENERATED from final_hybrid_v2.toml by scripts/make_tuned_config.py — do not hand-edit.
# Every other line is byte-identical to the control arm's config. Changed keys:
#   [model] latent_dim: 128 -> 384
#   [training] encoder_lr: 5e-3 -> 0.0042
#   [training.scheduler] (new section) min_lr = 4.975e-08
#   [training.scheduler] patience: (unset) -> 4
#   [training.scheduler] factor: (unset) -> 0.37
# A' finals rank 3: +1.35% (2SE 0.21%)
#
# fm pretrain — STAGE C final 24-task run (RIKYU hyper-parameter tuning campaign).
#
# Replay/training recipe is the validated HYBRID_RECIPE.md m150 configuration, frozen:
#   resample = "epoch", amount = max(1500, 0.3*N_t), patience 24, max_epochs 150.
# The [model] / [training] block below is the UNTUNED baseline — arm C-base runs this file
# as-is (the control), arm C-tuned runs it with the Stage A+B winners applied via --set.
# Keeping one file for both arms guarantees the two arms differ ONLY in the tuned knobs.
[data]
composition_column = "composition"
val_split = 0.1
test_split = 0.1
split_random_seed = 42
batch_size = 256
num_workers = 0

[descriptor]
kind = "kmd"
n_grids = 8

[datasets.qc]
path = "data/qc_ac_te_mp_dos_reformat_20260515.pd.parquet"

[datasets.magnetic]
path = "data/NEMAD_magnetic_20260419_norm.parquet"

[datasets.superconductor]
path = "data/NEMAD_superconductor_20260425_norm.parquet"

[datasets.phonix]
path = "data/phonix-db-filtered_20260425_norm.parquet"

# ---- qc regression (9) ----
[[tasks]]
name = "density"
kind = "regression"
dataset = "qc"
column = "Density (normalized)"

[[tasks]]
name = "efermi"
kind = "regression"
dataset = "qc"
column = "Efermi (normalized)"

[[tasks]]
name = "final_energy"
kind = "regression"
dataset = "qc"
column = "Final energy per atom (normalized)"

[[tasks]]
name = "total_magnetization"
kind = "regression"
dataset = "qc"
column = "Total magnetization (normalized)"

[[tasks]]
name = "volume"
kind = "regression"
dataset = "qc"
column = "Volume (normalized)"

[[tasks]]
name = "dielectric_total"
kind = "regression"
dataset = "qc"
column = "Dielectric total (normalized)"

[[tasks]]
name = "dielectric_ionic"
kind = "regression"
dataset = "qc"
column = "Dielectric ionic (normalized)"

[[tasks]]
name = "dielectric_electronic"
kind = "regression"
dataset = "qc"
column = "Dielectric electronic (normalized)"

[[tasks]]
name = "formation_energy"
kind = "regression"
dataset = "qc"
column = "Formation energy per atom (normalized)"

# ---- NEMAD magnetic regression (4) ----
[[tasks]]
name = "magnetization"
kind = "regression"
dataset = "magnetic"
column = "Magnetization (normalized)"

[[tasks]]
name = "curie"
kind = "regression"
dataset = "magnetic"
column = "Curie temperature (normalized)"

[[tasks]]
name = "neel"
kind = "regression"
dataset = "magnetic"
column = "Neel temperature (normalized)"

[[tasks]]
name = "magnetic_moment"
kind = "regression"
dataset = "magnetic"
column = "Magnetic moment (normalized)"

# ---- NEMAD superconductor regression (1) ----
[[tasks]]
name = "tc"
kind = "regression"
dataset = "superconductor"
column = "Transition temperature (normalized)"

# ---- phonix regression (2) ----
[[tasks]]
name = "kp"
kind = "regression"
dataset = "phonix"
column = "kp (normalized)"

[[tasks]]
name = "klat"
kind = "regression"
dataset = "phonix"
column = "klat (normalized)"

# ---- qc kernel regression (7) ----
[[tasks]]
name = "magnetic_susceptibility"
kind = "kernel_regression"
dataset = "qc"
column = "Magnetic susceptibility (normalized)"
t_column = "Magnetic susceptibility (T/K)"

[[tasks]]
name = "zt"
kind = "kernel_regression"
dataset = "qc"
column = "ZT (normalized)"
t_column = "ZT (T/K)"

[[tasks]]
name = "power_factor"
kind = "kernel_regression"
dataset = "qc"
column = "Power factor (normalized)"
t_column = "Power factor (T/K)"

[[tasks]]
name = "thermal_conductivity"
kind = "kernel_regression"
dataset = "qc"
column = "Thermal conductivity (normalized)"
t_column = "Thermal conductivity (T/K)"

[[tasks]]
name = "electrical_resistivity"
kind = "kernel_regression"
dataset = "qc"
column = "Electrical resistivity (normalized)"
t_column = "Electrical resistivity (T/K)"

[[tasks]]
name = "dos_density"
kind = "kernel_regression"
dataset = "qc"
column = "DOS density (normalized)"
t_column = "DOS energy"

[[tasks]]
name = "seebeck"
kind = "kernel_regression"
dataset = "qc"
column = "Seebeck coefficient (normalized)"
t_column = "Seebeck coefficient (T/K)"

# ---- qc classification (1) ----
[[tasks]]
name = "material_type"
kind = "classification"
dataset = "qc"
column = "Material type (label)"
num_classes = 5

[model]
latent_dim = 384
encoder_hidden_dims = [256]
head_hidden_dims = [64]
kr_x_hidden_dims = [128, 64]
kr_t_hidden_dims = [16, 8]
n_kernel = 15

[training]
max_epochs = 150
encoder_lr = 0.0042
head_lr = 5e-3
kr_lr = 5e-4
kr_weight_decay = 5e-5
ae_lr = 5e-3
accelerator = "gpu"
devices = 1
seed = 2025


[training.scheduler]
min_lr = 4.975e-08
patience = 4
factor = 0.37

[training.early_stopping]
enabled = true
monitor = "val_final_loss"
mode = "min"
patience = 24
min_delta = 1e-4

[training.logging]
csv = true

[pretrain]
# reference three-segment order: 12 reg (grouped) -> 7 kr (ascending row count) -> 5 fixed tail
task_sequence = [
    "density", "efermi", "final_energy", "total_magnetization", "volume",
    "dielectric_total", "dielectric_ionic", "dielectric_electronic",
    "magnetization", "curie", "neel", "kp",
    "magnetic_susceptibility", "zt", "power_factor", "thermal_conductivity",
    "electrical_resistivity", "dos_density", "seebeck",
    "formation_energy", "magnetic_moment", "tc", "klat", "material_type",
]
n_runs = 1
task_order = "fixed"

[pretrain.replay]
interval = 1
amount = 0.30
resample = "epoch"
# per-task floor: every task whose 0.3*N < 1500 gets 1500 labels (clamped to N by the engine)
per_task = { dielectric_total = 1500, dielectric_ionic = 1500, dielectric_electronic = 1500, magnetization = 1500, neel = 1500, kp = 1500, zt = 1500, power_factor = 1500, thermal_conductivity = 1500, klat = 1500, magnetic_moment = 1500, magnetic_susceptibility = 1500 }

[output]
dir = "artifacts/rikyu_hparam_tuning_v2/stage_c/hybrid"
