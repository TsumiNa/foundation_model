name: CUDA 13 container (amd64 + arm64)

# One multi-arch image, ghcr.io/<repo>:<version> / :latest / :sha-<sha>. Docker and Apptainer pull the
# variant that matches the host (x86-64 nodes, or Grace nodes such as RIKYU's GB200 and R-CCS's GH200),
# so users never pick an architecture. Each variant is built on a native runner (no QEMU) and pushed by
# digest; the merge job then writes one manifest list under every tag.

on:
  pull_request:
    paths:
      - ".github/workflows/container.yml"
      - ".dockerignore"
      - "Dockerfile.cuda13"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/container.yml"
      - ".dockerignore"
      - "Dockerfile.cuda13"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cuda13-container-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
            expected_arch: x86_64
          - platform: linux/arm64
            arch: arm64
            # Native ARM runner: QEMU builds of the large PyTorch CUDA environment are slow and unreliable.
            runner: ubuntu-24.04-arm
            expected_arch: aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Derive image name and version from pyproject.toml
        id: image
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid OCI tag version from pyproject.toml: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cuda13
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          build-args: |
            IMAGE_VERSION=${{ steps.image.outputs.version }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            EXPECTED_ARCH=${{ matrix.expected_arch }}
            IMAGE_TITLE=yammi CUDA 13
            IMAGE_DESCRIPTION=PyTorch CUDA 13 runtime for yammi (x86-64 and Grace / AArch64 NVIDIA GPUs)
          # Per-arch cache scopes; the ARM runner has limited disk, so export only the final layers.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=min
          provenance: mode=max
          sbom: true

      - name: Keep the digest for the merge job
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Derive tags
        id: image
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$name:sha-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            tags="$tags $name:${version,,} $name:latest"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the multi-arch manifest under every tag
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        run: |
          refs=$(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)
          args=()
          for t in ${{ steps.image.outputs.tags }}; do args+=(-t "$t"); done
          docker buildx imagetools create "${args[@]}" $refs

      - name: Check both architectures are present
        shell: bash
        run: |
          first="${{ steps.image.outputs.tags }}"; first="${first%% *}"
          docker buildx imagetools inspect "$first"
          docker buildx imagetools inspect --raw "$first" | python -c '
          import json, sys
          plats = {f"{m["platform"]["os"]}/{m["platform"]["architecture"]}" for m in json.load(sys.stdin)["manifests"] if m.get("platform", {}).get("os") != "unknown"}
          assert {"linux/amd64", "linux/arm64"} <= plats, plats
          print("platforms:", sorted(plats))'
          {
            echo '### Published multi-arch image (linux/amd64 + linux/arm64)'
            for t in ${{ steps.image.outputs.tags }}; do echo "- \`$t\`"; done
            echo ''
            echo 'The GHCR package must be public so clusters such as RIKYU can pull it anonymously.'
          } >> "$GITHUB_STEP_SUMMARY"
